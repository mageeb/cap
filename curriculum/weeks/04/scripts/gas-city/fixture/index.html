<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CAP Paint</title>
<style>body{font:20px system-ui;margin:40px;background:#f7f3e9}canvas{border:2px solid #182c40;background:white;touch-action:none}button,select,input{font:inherit;margin:8px}</style>
<h1>CAP Paint</h1>
<label>Tool <select id="tool"><option value="pencil">Pencil</option><option value="eraser">Eraser</option></select></label>

<button id="clear">Clear</button><br><canvas id="canvas" width="640" height="360"></canvas>
<script type="module" src="./app.js"></script></html>
